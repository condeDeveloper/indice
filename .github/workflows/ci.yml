name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: toda via de acesso devolve as mesmas linhas
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: paginas lidas por seletividade
        run: mvn -B -ntp -q exec:java -Dexec.args="seletividade"

      - name: agrupado contra nao agrupado
        run: mvn -B -ntp -q exec:java -Dexec.args="agrupamento"

      - name: ordenar as linhas antes de buscar
        run: mvn -B -ntp -q exec:java -Dexec.args="ordenacao"

      - name: o tamanho da pagina muda a virada
        run: mvn -B -ntp -q exec:java -Dexec.args="pagina"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
